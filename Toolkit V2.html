<style id="css">
/* Layout: brand bands (black header, colour strip, yellow essentials) over a paper page of card grids; one SINC look, light only by choice. */
:root{--blue:#0096FF;--green:#2ACE7B;--yellow:#FCD731;--purple:#AB68F8;--black:#1D1D1D;--paper:#F4F3EB;--card:#FFFFFF;--line:#d9d7c8;--mute:#55554f;--soft:#d8d8d2;--font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--black);font:400 1rem/1.6 var(--font)}

.wrap{max-width:68rem;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--black);color:#fff;padding-block:4rem 3rem}
h1{font-size:clamp(2.4rem,7vw,4.5rem);line-height:1;margin:0 0 1rem;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.intro{max-width:36rem;margin:0;color:var(--soft);font-size:1.1rem;white-space:pre-wrap}
.logo-row{display:flex;justify-content:flex-end;align-items:center;gap:.5rem;margin:0 0 1.5rem;min-height:1rem}
.logo{height:3.5rem;width:auto;display:block}
.strip{display:flex;height:.6rem}.strip i{flex:1}
.essentials{background:var(--yellow);padding-block:2rem}
.essentials h2{margin:0 0 1rem}
.ess-grid{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(min(16rem,100%),1fr))}
.ess-item{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.ess-label{font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.ess-text{font-size:1.1rem;white-space:pre-wrap}
.btn.dark{background:var(--black);border-color:var(--black);color:#fff;text-decoration:none;display:inline-block}
.btn.ghost.dark{background:transparent;color:var(--black)}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--line);z-index:5}
nav .wrap{padding-block:.75rem;display:flex;gap:.5rem;overflow-x:auto}
nav button{font:inherit;font-weight:600;border:2px solid var(--black);background:transparent;color:var(--black);padding:.35rem 1rem;border-radius:99px;cursor:pointer;white-space:nowrap}

.sec-titles{min-width:0;flex:1}
.sec-desc,.imgs-intro{color:var(--mute);margin:0;white-space:pre-wrap}

.grid{display:grid;gap:1rem;align-items:start}
.texts{grid-template-columns:repeat(auto-fill,minmax(min(21rem,100%),1fr))}

.imgs-intro+.visuals{margin-top:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:1.25rem;display:flex;flex-direction:column;gap:.75rem;min-width:0}
.text-card{border-left:8px solid var(--c)}
.card-top{display:flex;gap:.5rem;align-items:flex-start;justify-content:space-between}

.img-title{font-weight:800}

.mail{color:var(--black);font-weight:600;user-select:all}
.linkbtn{font:inherit;font-size:.85rem;background:none;border:0;padding:0 .2rem;color:var(--blue);text-decoration:underline;cursor:pointer}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;font-size:.9rem;border:2px solid var(--blue);background:var(--blue);color:#fff;padding:.35rem .9rem;border-radius:.5rem;cursor:pointer;align-self:flex-start}

/* edit mode */
.editable{border-radius:.3rem;outline:1px dashed transparent;outline-offset:3px;cursor:text;min-width:2rem}
.editing .editable{outline-color:color-mix(in srgb,var(--purple) 55%,transparent)}
.editing .editable:hover{background:color-mix(in srgb,var(--purple) 8%,transparent)}
.editable:focus{outline:2px solid var(--purple);background:color-mix(in srgb,var(--purple) 6%,transparent)}

.ib:hover:not(:disabled){border-color:var(--black)}
.ib.del:hover{border-color:#c0392b;color:#c0392b}
.ib:disabled{opacity:.35;cursor:default}
.essentials .ib{background:transparent;border-color:color-mix(in srgb,var(--black) 30%,transparent)}
.swatches{display:flex;gap:.4rem;align-items:center;font-size:.8rem;color:var(--mute)}
.sw{width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--black)}
.add-row{margin-top:1rem}
.add-btn{border-style:dashed}
.url-field{display:block;font-size:.8rem;font-weight:600;margin-top:.3rem}
.url-field input{width:100%;font:inherit;font-size:.9rem;padding:.3rem .5rem;margin-top:.15rem;border:1px solid color-mix(in srgb,var(--black) 30%,transparent);border-radius:.4rem;background:color-mix(in srgb,#fff 60%,transparent);color:var(--black)}
.new-section{width:100%;padding:1rem;border:2px dashed var(--line);border-radius:.9rem;background:transparent;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.new-section:hover{border-color:var(--black);color:var(--black)}
.toolbar{position:fixed;right:calc(1rem + env(safe-area-inset-right,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));left:auto;z-index:20;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;background:var(--black);color:#fff;padding:.5rem;border-radius:.8rem;box-shadow:0 6px 24px rgb(0 0 0 / .25);max-width:calc(100vw - 2rem)}
.toolbar .status{font-size:.85rem;color:var(--soft);padding:0 .4rem}
.toolbar .btn.ghost{color:#fff;border-color:#fff}
.toolbar .btn.ok{background:var(--green);border-color:var(--green);color:var(--black)}
#toast{position:fixed;left:50%;bottom:calc(5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(200%);opacity:0;background:var(--black);color:#fff;padding:.6rem 1.1rem;border-radius:.6rem;font-weight:600;transition:transform .2s,opacity .2s;z-index:30;max-width:calc(100vw - 2rem);text-align:center}
#toast.on{transform:translateX(-50%);opacity:1}
@media (max-width:40rem){.toolbar{left:calc(1rem + env(safe-area-inset-left,0px));justify-content:center}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

<script type="application/json" id="state">{"header":{"logo":"/_blob/186b5813253577c80e90905cf907b3ab","title":"Communication toolkit","intro":"Copy the text, download the images and share them on your own channels."},"essentials":{"title":"The essentials","items":[{"label":"DATE AND HOUR","text":"Wednesday  December 2nd\nDoors open at 18:00. \nProgram runs from 18:30-22:30."},{"label":"LOCATION","text":"TRIX\nNoordersingel 28/30, \n2140 Antwerp"},{"label":"CLAIM YOUR FREE TICKET","text":"via Luma","url":"https://luma.com/tawkiuhl"}]},"sections":[{"id":"social","title":"Social media","desc":"Messages for your own channels, ready to paste. ","imagesIntro":"","blocks":[{"type":"text","title":"Linkedin: ","color":"blue","text":"Every career starts with a vision. That's why we're excited to highlight BLUEPRINT, an event by SINC that brings together young talent to gain the insights, inspiration and connections to turn that vision into reality.\n\nOn Wednesday, December 2nd, ambitious students, recent graduates, and young professionals will gather in Antwerp to shape their futures. With two distinct stages, there is something for everyone:\n🏢 Stage 1: Career Blueprint – For those ready to discover where their talents can take them.\n🚀 Stage 2: Entrepreneurial Essentials – For those eager to turn an idea into a real business.\n\nWe believe in empowering the next generation of innovators and leaders. Are you a student or young professional looking for honest stories, actionable insights, and a great network?\nMake sure to grab your free ticket before they sell out! \n\n🤝 Organised by @SINC\n🎟️ Register here: https://luma.com/tawkiuhl\n📅 Dec 2 | 🕡 18:30 | 📍 Trix, Antwerp\n\n\n#SINC #Blueprint2026 #Entrepreneurship #CareerDevelopment #YoungTalent #Antwerp"},{"type":"text","title":"Instagram: ","color":"purple","text":"Your career doesn’t come with a manual. Come draw your own blueprint! 🛠️✨\n\nBLUEPRINT is SINC Antwerp’s biggest event of the year, made for everyone who wants to shape their own future. Whether you want to climb the corporate ladder or launch your own startup, you’ll get the insights to make it happen.\n\nExpect inspiring keynotes, honest stories, and plenty of time for drinks and networking! 🥂🤝\n\n📍 Trix, Antwerp\n📅 Wed, Dec 2nd | Doors 18:00\n🤝 Organised by @sincantwerpen\n🎟️ FREE entry, but limited spots! Go to https://luma.com/tawkiuhl\n\n#SINC #Blueprint #StudentOndernemer #Antwerpen #Trix #Career #Startup"},{"type":"text","title":"Speaker focused (Linkedin):","color":"yellow","text":"Ready to shape your own future? 🚀\n\nOn December 2nd, I’ll be joining BLUEPRINT, SINC’s biggest event of the year for students, student-entrepreneurs, and young professionals.\nWhether you want to build a career inside an established company or build a business of your own, this evening is packed with the inspiration you need. Instead of ready-made manuals, you’ll find honest stories about the steps, detours, and mistakes behind a successful career.\n\nWhat to expect:\n\n🎤 Inspiring keynotes\n🧠 2 Stages: Career Blueprint & Entrepreneurial Essentials\n🤝 High-value networking with speakers, founders, and like-minded peers\n🥂 Drinks & good vibes\n✨ Organised by @SINC\n\nLet’s connect and get inspired! \n🎟️ Claim your free spot here: https://luma.com/tawkiuhl\n📅 Wednesday, December 2 \n📍 Trix, Antwerp (Doors open 18:00)\n\n#Blueprint #SINC #StudentOndernemen #CareerGoals #FutureLeaders"},{"type":"text","title":"Whatsapp:","color":"green","text":"Hey everyone! 👋 Still figuring out your next career move or dreaming of starting your own business? Come to BLUEPRINT, SINC Antwerp’s biggest event of the year! 🚀\n\nExpect inspiring talks, honest stories from pros & student founders, and plenty of drinks & networking afterwards. 🥂\n\n📍 Trix, Antwerp\n📅 Wed, Dec 2nd| Doors open at 18:00\n🤝 Organised by SINC Antwerp\n🎟️ Free entry, but spots are limited!\n\nGrab your ticket here: https://luma.com/tawkiuhl"}]},{"id":"email","title":"Internal marketing","desc":"for internal and student communication.","imagesIntro":"","blocks":[{"type":"text","title":"internal communication to students","color":"green","text":"Subject: You are invited to BLUEPRINT at December 2nd\n\nYour career doesn’t come with a manual. On Wednesday, December 2nd, SINC is hosting BLUEPRINT, a free evening of keynotes and real stories for students, young professionals, and aspiring founders. Taking place at Trix in Antwerp, the event features two tracks: Career Blueprint (Learn from pros who found their way) and Entrepreneurial Essentials (Learn from experts who built their own). \n\nExpect honest stories about career detours, valuable networking, and drinks! \n\nEntry is free, but registration is required. Claim your ticket here: https://luma.com/tawkiuhl"},{"type":"text","title":"Internal communication to collegeas","color":"black","text":"Onderwerp: Help us put SINC’s BLUEPRINT on the map! 🚀\n\nDear colleagues,\n\nOn December 2nd at 18:00 (6:00 PM), SINC is hosting BLUEPRINT at Trix. You and your students are warmly invited to join us! You can register via this link: https://luma.com/tawkiuhl.\n\nWe would also really appreciate your help in promoting the event:\n- Post the announcement on the intranet\n- Share it with your team and students\n- Use the materials provided in the toolkit: https://mathishansen-cell.github.io/communicatietoolkit_BLUEPRINT/.\n\nThank you for your help!"},{"type":"text","title":"interne communicatie naar  collega's","color":"black","text":"Onderwerp: Help je mee SINC’s BLUEPRINT op de kaart te zetten? 🚀\n\nBeste collega's,\n\nOp 2 december om 18:00 organiseert SINC, BLUEPRINT in de Trix. Jij en je studenten zijn van harte welkom. Inschrijven kan via deze link: https://luma.com/tawkiuhl.\n\nWe vragen jullie ook om het evenement mee bekend te maken:\n- Plaats het bericht op het intranet\n- Deel het met je team en studenten\n- Gebruik het materiaal uit de toolkit: https://mathishansen-cell.github.io/communicatietoolkit_BLUEPRINT/.\n\nBedankt voor je hulp!"}]},{"id":"e7ktjwm","title":"Visuals","desc":"Visuals for your own channels, ready to download.","imagesIntro":"","blocks":[{"type":"image","title":"Post: Instagram & Linkedin","src":"/_blob/3f6499ec6af8683172fb95bafc8b6273","note":""},{"type":"image","title":"Television / presentation","src":"/_blob/fbf381d958bc4c03f52e0a7cc1459739","note":""},{"type":"image","title":"Story","src":"/_blob/134a21fe4a4268f61fad72fa67445c4c","note":""},{"type":"image","title":"Story: attending","src":"/_blob/c5b7ecc262cd19988355331d5376e416","note":""}]}],"footer":{"lead":"Questions?","text":"Contact Mathis via","email":"info@sincantwerpen.be"}}</script>
<script id="app">
(function(){

var HEAD='<title>SINC communicatietoolkit</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">';
var DEFAULT_RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';

function $(s){return document.querySelector(s);}
function el(t,cls,txt){var e=document.createElement(t); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;}

function uid(){return Math.random().toString(36).slice(2,9);}
var toastEl=el("div"); toastEl.id="toast"; toastEl.setAttribute("role","status"); toastEl.setAttribute("aria-live","polite"); document.body.appendChild(toastEl);
function toast(m){toastEl.textContent=m; toastEl.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(function(){toastEl.classList.remove("on");},2600);}
function markDirty(){ if(!dirty){dirty=true; updateStatus();} }
function change(){ dirty=true; render(); }

/* an editable text element bound to obj[key] */
function ed(tag,cls,obj,key,o){
  o=o||{};
  if(!editing&&o.optional&&!obj[key]) return document.createComment("");
  var e=el(tag,cls,obj[key]||"");
  if(!editing) return e;
  try{e.contentEditable="plaintext-only";}catch(x){}
  if(e.contentEditable!=="plaintext-only") e.contentEditable="true";
  e.classList.add("editable"); e.setAttribute("data-ph",o.ph||""); e.setAttribute("role","textbox"); e.setAttribute("aria-label",o.ph||key);

/* move/delete buttons; `same` limits moves to siblings of the same kind */
function tools(arr,i,label,same){

  arr.forEach(function(x,j){ if(!same||same(x)) idx.push(j); });
  var p=idx.indexOf(i);
  function mv(dir){ var j=idx[p+dir]; var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; change(); }
  t.append(ib("↑",label+" omhoog",function(){mv(-1);},p<=0), ib("↓",label+" omlaag",function(){mv(1);},p>=idx.length-1), ib("✕",label+" verwijderen",function(){arr.splice(i,1); change(); toast(label.charAt(0).toUpperCase()+label.slice(1)+" verwijderd. Annuleren zet alles terug.");},false,"del"));
  return t;
}

async function copyText(text,msg){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ var a=document.createElement("textarea"); a.value=text; document.body.appendChild(a); a.select(); try{document.execCommand("copy");}catch(x){} a.remove(); }
  toast(msg||"Text copied");
}

/* images: uploaded to the artifact's asset store, or shrunk to an embedded image */
function shrink(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ var img=new Image(); img.onload=function(){ var m=1600, k=Math.min(1,m/Math.max(img.width,img.height)); var c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL(f.type==="image/png"?"image/png":"image/jpeg",.88)); }; img.onerror=rej; img.src=r.result; };
    r.onerror=rej; r.readAsDataURL(f);
  });
}
async function storeImage(f){
  if(assets){ try{ var r=await assets.upload(f); if(r&&r.url) return r.url; }catch(e){} }
  return await shrink(f);
}
function pickImage(cb){
  var i=document.createElement("input"); i.type="file"; i.accept="image/*"; i.hidden=true; document.body.appendChild(i);
  i.onchange=async function(){ var f=i.files&&i.files[0]; i.remove(); if(!f) return; toast("Beeld wordt geladen…"); try{ cb(await storeImage(f)); change(); toast("Beeld toegevoegd"); }catch(e){ toast("Dit beeld kon niet geladen worden. Probeer een PNG of JPG."); } };
  i.click();
}
async function download(b){
  var base=(b.title||"beeld").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"beeld";
  try{
    var blob=await (await fetch(b.src)).blob();
    var ext=((blob.type.split("/")[1])||"png").replace("jpeg","jpg").replace("svg+xml","svg");
    var name=base+"."+ext;
    if(dl){ await dl.save({filename:name,data:blob}); toast("Image downloaded"); }
    else { var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove(); toast("Image downloaded"); }
  }catch(e){ if(e&&e.code&&e.code!=="unavailable") return; toast("Download didn't work here. Right-click the image to save it."); }
}

/* ---------- page parts ---------- */

      if(editing){
        d.append(ed("div","ess-text",it,"text",{single:1,ph:"Tekst op de knop"}));
        var lab=el("label","url-field","Link"), inp=el("input"); inp.type="url"; inp.value=it.url; inp.id="url-"+i; inp.oninput=function(){it.url=inp.value.trim(); markDirty();}; lab.append(inp); d.append(lab);
      } else {
        var r=el("div","row"), a=el("a","btn dark",it.text||"Open link"); a.href=it.url; a.target="_blank"; a.rel="noopener";
        r.append(a, btn("Copy link",function(){copyText(it.url,"Link copied");},"ghost dark")); d.append(r);
      }
    } else d.append(ed("div","ess-text",it,"text",{ph:"Info"}));
    g.append(d);
  });
  w.append(g);
  if(editing){ var r2=el("div","row add-row"); r2.append(btn("+ Info",function(){E.items.push({label:"Nieuw",text:""}); change();},"ghost dark add-btn"), btn("+ Link",function(){E.items.push({label:"Link",text:"Open link",url:"https://"}); change();},"ghost dark add-btn")); w.append(r2); }
  sec.append(w); return sec;
}
function navEl(){
  var titles=[]; S.sections.forEach(function(s){ var t=(s.title||"").trim(); if(t&&titles.indexOf(t)<0) titles.push(t); });
  if(editing||titles.length<2) return document.createComment("");
  if(filter!=="All"&&titles.indexOf(filter)<0) filter="All";
  var n=el("nav"), w=el("div","wrap"); n.setAttribute("aria-label","Categories");
  ["All"].concat(titles).forEach(function(t){ var b=el("button","",t); b.type="button"; b.setAttribute("aria-pressed",String(t===filter)); b.onclick=function(){filter=t; render();}; w.append(b); });
  n.append(w); return n;
}
function swatches(b){
  var s=el("div","swatches"); s.append("Kleur");
  Object.keys(BRAND).forEach(function(k){ var x=el("button","sw"); x.type="button"; x.style.background=BRAND[k]; x.setAttribute("aria-label","Kleur "+BRAND_NL[k]); x.title=BRAND_NL[k]; x.setAttribute("aria-pressed",String(b.color===k)); x.onclick=function(){b.color=k; change();}; s.append(x); });
  return s;
}
function isText(x){return x.type==="text";} function isImg(x){return x.type==="image";}
function textCard(sec,b){
  var c=el("article","card text-card"), top=el("div","card-top");
  c.style.setProperty("--c",BRAND[b.color]||BRAND.blue);
  top.append(ed("h3","",b,"title",{single:1,ph:"Titel van het blok"}));
  if(editing) top.append(tools(sec.blocks,sec.blocks.indexOf(b),"tekstblok",isText));
  c.append(top, ed("div","card-text",b,"text",{ph:"Typ of plak hier de tekst"}));
  c.append(editing?swatches(b):btn("Copy text",function(){copyText(b.text||"");}));
  return c;
}
function imageCard(sec,b){
  var c=el("article","card");
  if(b.src){ var img=el("img"); img.src=b.src; img.alt=b.title||"Beeld"; img.loading="lazy"; c.append(img); }
  else c.append(el("p","no-img",editing?"Nog geen beeld. Kies hieronder een bestand.":"Image coming soon."));
  var top=el("div","card-top"); top.append(ed("div","img-title",b,"title",{single:1,ph:"Naam van het beeld"}));
  if(editing) top.append(tools(sec.blocks,sec.blocks.indexOf(b),"beeldblok",isImg));
  c.append(top, ed("p","note",b,"note",{ph:"Notitie of voorbeeldzin (optioneel)",optional:1}));
  if(editing){ var r=el("div","row"); r.append(btn(b.src?"Vervang beeld":"Kies beeld",function(){pickImage(function(u){b.src=u;});})); if(b.src) r.append(btn("Verwijder beeld",function(){b.src=""; change();},"ghost")); c.append(r); }
  else if(b.src) c.append(btn("Download",function(){download(b);}));
  return c;
}
function sectionEl(sec,si){
  var s=el("section","block"), head=el("div","sec-head"), ht=el("div","sec-titles");
  ht.append(ed("h2","",sec,"title",{single:1,ph:"Titel van de sectie"}), ed("p","sec-desc",sec,"desc",{ph:"Korte beschrijving (optioneel)",optional:1}));
  head.append(ht); if(editing) head.append(tools(S.sections,si,"sectie"));
  s.append(head);
  var texts=sec.blocks.filter(isText), imgs=sec.blocks.filter(isImg);
  if(texts.length){ var g=el("div","grid texts"); texts.forEach(function(b){g.append(textCard(sec,b));}); s.append(g); }
  if(imgs.length){
    if(sec.imagesIntro===undefined) sec.imagesIntro="";
    s.append(ed("p","imgs-intro",sec,"imagesIntro",{ph:"Intro boven de beelden (optioneel)",optional:1}));
    var g2=el("div","grid visuals"); imgs.forEach(function(b){g2.append(imageCard(sec,b));}); s.append(g2);
  }
  if(editing){ var r=el("div","row add-row"); r.append(btn("+ Tekstblok",function(){sec.blocks.push({type:"text",title:"",color:"blue",text:""}); change();},"ghost add-btn"), btn("+ Beeldblok",function(){sec.blocks.push({type:"image",title:"",src:"",note:""}); change();},"ghost add-btn")); s.append(r); }
  return s;
}
function mainEl(){
  var m=el("main"), w=el("div","wrap");
  S.sections.forEach(function(sec,i){ if(editing||filter==="All"||(sec.title||"").trim()===filter) w.append(sectionEl(sec,i)); });
  if(editing){ var b=el("button","new-section","+ Nieuwe sectie"); b.type="button"; b.onclick=function(){S.sections.push({id:uid(),title:"Nieuwe sectie",desc:"",imagesIntro:"",blocks:[{type:"text",title:"",color:"blue",text:""}]}); change(); setTimeout(function(){var h=document.querySelectorAll("section.block h2"); h=h[h.length-1]; if(h){h.scrollIntoView({block:"center"}); h.focus();}},50);}; w.append(b); }
  else if(!S.sections.length) w.append(el("p","sec-desc","No content yet."));
  m.append(w); return m;
}
function footerEl(){
  var F=S.footer, f=el("footer"), w=el("div","wrap");
  w.append(ed("strong","",F,"lead",{single:1,ph:"Vragen?",optional:1}), ed("span","",F,"text",{single:1,ph:"Contacteer [naam] via",optional:1}), ed("span","mail",F,"email",{single:1,ph:"e-mailadres",optional:1}));
  if(!editing&&F.email&&F.email.indexOf("@")>0) w.append(btn("copy",function(){copyText(F.email,"Email address copied");},"linkbtn"));
  w.querySelectorAll(".btn.linkbtn").forEach(function(b){b.className="linkbtn";});
  f.append(w); return f;
}
function toolbarEl(){
  if(!editing&&!canEditPage) return document.createComment("");
  var t=el("div","toolbar"); t.setAttribute("role","toolbar"); t.setAttribute("aria-label","Bewerken");
  if(!editing){ t.append(btn("Pagina bewerken",function(){editing=true; render();},"ok")); return t; }
  var st=el("span","status"); st.id="status"; t.append(st);
  var cancel=btn(cancelArmed?"Ja, wijzigingen weggooien":"Annuleren",function(){
    if(dirty&&!cancelArmed){ cancelArmed=true; render(); setTimeout(function(){ if(cancelArmed){cancelArmed=false; render();} },4000); return; }
    cancelArmed=false; S=JSON.parse(SAVED); dirty=false; editing=false; readOnly=false; try{sessionStorage.removeItem(DRAFT);}catch(e){} render();
  },"ghost");
  var save=btn(busy?"Opslaan…":"Opslaan",saveAll,"ok"); save.id="savebtn"; save.disabled=busy||readOnly||!dirty;
  t.append(cancel,save);
  setTimeout(updateStatus,0);
  return t;
}
function updateStatus(){
  var st=$("#status"), sv=$("#savebtn"); if(!st) return;
  st.textContent=readOnly?"Alleen lezen":dirty?"Niet opgeslagen":"Geen wijzigingen";
  if(sv) sv.disabled=busy||readOnly||!dirty;
}
function render(){
  var root=$("#root"); root.innerHTML="";
  document.body.classList.toggle("editing",editing);
  root.append(headerEl(), stripEl(), essentialsEl(), navEl(), mainEl(), footerEl(), toolbarEl());
}

/* ---------- saving: regenerate the whole page from state and publish it ---------- */
function buildDoc(){
  var hs=document.head&&document.head.querySelector("style"), reset=hs&&/safe-area/.test(hs.textContent)?hs.textContent:DEFAULT_RESET;
  var css=document.getElementById("css").textContent, app=document.getElementById("app").textContent;
  var json=JSON.stringify(S).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+HEAD+'\n<style id="css">'+css+'</style>\n<div id="root"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app">'+app+'<\/script>\n</body></html>';
}
async function saveAll(){
  if(!art){ toast("Opslaan werkt alleen als de pagina in Claude geopend is."); return; }
  busy=true; updateStatus(); var sb=$("#savebtn"); if(sb) sb.textContent="Opslaan…";
  try{ sessionStorage.setItem(DRAFT,JSON.stringify(S)); }catch(e){}
  try{ await art.publish(buildDoc()); toast("Opgeslagen"); }
  catch(e){
    var c=e&&e.code;
    if(c==="conflict"){ toast("Iemand anders sloeg net op. De pagina herlaadt en zet je wijzigingen terug."); return; }
    try{ sessionStorage.removeItem(DRAFT); }catch(x){}
    busy=false;
    if(["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].indexOf(c)>=0){ readOnly=true; toast("Je kunt deze pagina bekijken, maar niet opslaan."); }
    else if(c==="too_large") toast("De pagina is te groot om op te slaan. Gebruik kleinere beelden.");
    else if(c==="rate_limited") toast("Je slaat heel snel na elkaar op. Wacht even en probeer opnieuw.");
    else toast("Opslaan lukte niet. Probeer het opnieuw.");
    render();
  }
}

render();

/* light up saving, uploads and downloads once the viewer answers */
(async function init(){
  var tries=0;
  while(!(window.claude&&window.claude.use)&&tries<6){ await new Promise(function(r){setTimeout(r,250);}); tries++; }
  if(!(window.claude&&window.claude.use)) return;
  hasRuntime=true;
  function use(n){ try{ return Promise.resolve(window.claude.use(n)).catch(function(){return null;}); }catch(e){ return Promise.resolve(null); } }
  var r=await Promise.all([use("artifact"),use("assets"),use("downloads"),use("user")]);
  art=r[0]; assets=r[1]; dl=r[2]; var u=r[3];
  var can=!!art; if(can&&u){ try{ can=(await u.canEdit())!==false; }catch(e){} }
  if(can!==canEditPage||editing){ canEditPage=can; if(!editing) render(); else updateStatus(); }
})();
})();
</script>
